kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: netpol-lab
networking:
  # Disable kind's default CNI (kindnet) so Calico can take over.
  # kindnet does not enforce Network Policies.
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
  - role: worker
  - role: worker
