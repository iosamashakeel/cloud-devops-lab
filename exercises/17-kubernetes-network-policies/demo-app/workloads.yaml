apiVersion: v1
kind: Namespace
metadata:
  name: netpol-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: netpol-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: netpol-lab
spec:
  selector:
    app: frontend
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: netpol-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: http-echo
          image: hashicorp/http-echo:1.0
          args:
            - -text=hello from the backend
            - -listen=:5678
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: netpol-lab
spec:
  selector:
    app: backend
  ports:
    - port: 5678
---
# Test pods. The client carries the frontend label, so it stands in for
# frontend traffic; the intruder does not, so policies should block it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: netpol-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      role: client
  template:
    metadata:
      labels:
        app: frontend
        role: client
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.5.0
          command: ["sleep", "infinity"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intruder
  namespace: netpol-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intruder
  template:
    metadata:
      labels:
        app: intruder
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.5.0
          command: ["sleep", "infinity"]
