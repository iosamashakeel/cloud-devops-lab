# Ansible inventory for Exercise 05.
#
# Real lab: replace the [webservers] hosts with your own IPs/hostnames and set
# ansible_user to your SSH user. Copy to inventory.ini.local and point
# ansible.cfg at it if you don't want credentials in git.
#
#   ansible_user  — SSH login user
#   ansible_host  — the actual IP when the alias isn't resolvable

[webservers]
# Example targets — uncomment and edit for your lab:
# web1 ansible_host=192.168.1.20 ansible_user=ubuntu
# web2 ansible_host=192.168.1.21 ansible_user=ubuntu

[webservers:vars]
http_port=80
server_name=devops-lab.local

# Run everything on this machine (no SSH needed) — try the playbook here first.
[local]
localhost ansible_connection=local
