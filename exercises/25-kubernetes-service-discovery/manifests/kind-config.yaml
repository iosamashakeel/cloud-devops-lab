# kind cluster config: map host port 30080 to the node's NodePort
# range so the backend NodePort Service is reachable from the laptop
# at http://localhost:30080/
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
