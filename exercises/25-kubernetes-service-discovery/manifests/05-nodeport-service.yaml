apiVersion: v1
kind: Service
metadata:
  name: backend-nodeport
  namespace: discovery-lab
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      # Fixed NodePort so kind can map it to the host (see kind-config.yaml).
      nodePort: 30080
