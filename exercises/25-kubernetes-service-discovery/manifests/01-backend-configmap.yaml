apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-server
  namespace: discovery-lab
data:
  server.py: |
    """Tiny HTTP server that answers with its own pod hostname.

    Runs on port 8080. No dependencies beyond the Python standard
    library, so it works in the slim python image.
    """
    import http.server
    import socket


    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            body = f"hello from {socket.gethostname()}\n".encode()
            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *args):
            pass


    if __name__ == "__main__":
        http.server.HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
