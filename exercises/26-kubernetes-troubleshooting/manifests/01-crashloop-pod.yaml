# Deliberately broken: the container runs a command that does not exist,
# so it exits immediately and Kubernetes restarts it in a loop.
apiVersion: v1
kind: Pod
metadata:
  name: crashloop
  namespace: lab-troubleshooting
  labels:
    app: crashloop
spec:
  containers:
    - name: web
      image: busybox:1.36
      command: ["sh", "-c", "this-command-does-not-exist"]
