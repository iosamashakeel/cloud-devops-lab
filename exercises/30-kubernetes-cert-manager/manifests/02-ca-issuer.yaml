# The lab CA: a self-signed certificate with isCA set, stored in
# the Secret "lab-ca". The ClusterIssuer below uses that Secret
# to sign leaf certificates.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-ca
  namespace: lab-certs
spec:
  isCA: true
  commonName: lab-ca
  secretName: lab-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-ca-issuer
spec:
  ca:
    secretName: lab-ca
