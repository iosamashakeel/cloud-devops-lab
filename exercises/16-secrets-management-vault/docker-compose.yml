services:
  vault:
    image: hashicorp/vault:1.16
    container_name: vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8200/v1/sys/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  demo-app:
    build: ./demo-app
    container_name: vault-demo-app
    environment:
      VAULT_ADDR: http://vault:8200
      # Pass your own least-privilege token (see README step 3) or leave the
      # dev-mode root token for the first run:
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
    ports:
      - "8080:8080"
    depends_on:
      vault:
        condition: service_healthy
