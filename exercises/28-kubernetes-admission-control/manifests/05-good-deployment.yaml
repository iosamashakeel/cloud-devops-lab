apiVersion: apps/v1
kind: Deployment
metadata:
  name: good-app
  namespace: lab-admission
  labels:
    app: good-app
    team: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: good-app
  template:
    metadata:
      labels:
        app: good-app
        team: platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Unprivileged nginx listens on 8080, so it can run as a
          # non-root user. The default nginx image binds port 80
          # and cannot run this way.
          image: nginxinc/nginx-unprivileged:1.27
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
