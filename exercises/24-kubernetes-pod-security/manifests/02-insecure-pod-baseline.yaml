# The insecure pod, trimmed just enough for the "baseline" namespace to
# accept it: no privileged flag, no hostPath volume, no added
# capabilities. What is left is still bad — it runs as root, can
# escalate privileges, and can write anywhere in its own filesystem —
# but baseline only blocks the worst offences. That gap is exactly why
# production namespaces should enforce "restricted".
apiVersion: v1
kind: Pod
metadata:
  name: insecure
  namespace: security-lab-baseline
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        runAsUser: 0
        allowPrivilegeEscalation: true
