# Hardened pod: non-root user, no privilege escalation, read-only root
# filesystem, all capabilities dropped, seccomp RuntimeDefault. This is
# the minimum a pod in a "restricted" namespace must satisfy.
apiVersion: v1
kind: Pod
metadata:
  name: secure
  namespace: security-lab
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
