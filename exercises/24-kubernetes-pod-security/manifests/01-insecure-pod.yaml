# Deliberately insecure pod: runs as root, privileged, hostPath mount,
# extra capabilities. The Pod Security admission controller rejects this
# in the "restricted" namespace (security-lab). Apply it and read the
# error — every line names one violation.
apiVersion: v1
kind: Pod
metadata:
  name: insecure
  namespace: security-lab
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        privileged: true
        runAsUser: 0
        allowPrivilegeEscalation: true
        capabilities:
          add: ["SYS_ADMIN", "NET_RAW"]
      volumeMounts:
        - name: host-etc
          mountPath: /host/etc
          readOnly: true
  volumes:
    - name: host-etc
      hostPath:
        path: /etc
        type: Directory
