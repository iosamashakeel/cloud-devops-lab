apiVersion: split.smi-spec.io/v1alpha2
kind: TrafficSplit
metadata:
  name: web-canary
  namespace: lab-mesh
spec:
  # The Service clients actually call. Linkerd reads this split and
  # distributes traffic across the backends below.
  service: web
  backends:
    # 90% of requests keep going to the stable version...
    - service: web-v1
      weight: 900m
    # ...and 10% go to the canary. Raise the weight in small steps
    # as confidence grows, and roll it back the same way.
    - service: web-v2
      weight: 100m
---
# The backends above are Services, not Deployments, so each version
# needs its own Service selecting only its own pods.
apiVersion: v1
kind: Service
metadata:
  name: web-v1
  namespace: lab-mesh
  labels:
    app: web
    version: v1
spec:
  selector:
    app: web
    version: v1
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web-v2
  namespace: lab-mesh
  labels:
    app: web
    version: v2
spec:
  selector:
    app: web
    version: v2
  ports:
    - name: http
      port: 80
      targetPort: 8080
