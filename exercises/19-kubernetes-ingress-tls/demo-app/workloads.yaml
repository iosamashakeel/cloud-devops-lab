apiVersion: v1
kind: Namespace
metadata:
  name: ingress-lab
---
# Web frontend: serves a static page. The html is baked into the image
# via a ConfigMap mounted at /usr/share/nginx/html.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-content
  namespace: ingress-lab
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>Ingress Lab</title></head>
    <body>
      <h1>Hello from the web frontend</h1>
      <p>Served by nginx, reached through the Ingress.</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ingress-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: web-content
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ingress-lab
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
# API backend: a tiny responder that answers /api with JSON.
# Uses httpd with a static file, so there is no app code to build.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-content
  namespace: ingress-lab
data:
  index.json: |
    {"service": "api", "message": "Hello from the api backend"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ingress-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: httpd
          image: httpd:2.4-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: content
              mountPath: /usr/local/apache2/htdocs
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: api-content
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ingress-lab
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
