apiVersion: v1
kind: ServiceAccount
metadata:
  name: webapp-operator
  namespace: lab-operators
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webapp-operator
  namespace: lab-operators
rules:
  # Read and update the custom resources it manages.
  - apiGroups: ["example.lab"]
    resources: ["webapps", "webapps/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # Create and manage the workloads a WebApp turns into.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webapp-operator
  namespace: lab-operators
subjects:
  - kind: ServiceAccount
    name: webapp-operator
    namespace: lab-operators
roleRef:
  kind: Role
  name: webapp-operator
  apiGroup: rbac.authorization.k8s.io
