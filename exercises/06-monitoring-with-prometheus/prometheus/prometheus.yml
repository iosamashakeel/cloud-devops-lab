# Prometheus scrape configuration for the DevOps Lab monitoring exercise.
# This is a complete, working config — run `docker compose up` in the exercise folder.

global:
  scrape_interval: 15s       # scrape targets every 15 seconds
  evaluation_interval: 15s   # evaluate alert rules every 15 seconds

# Alert rules are loaded from this directory.
rule_files:
  - "/etc/prometheus/rules/*.yml"

# Alertmanager is not used in this exercise, so alerts are only visible
# in the Prometheus UI (Alerts tab) and via the /api/v1/alerts endpoint.

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node"
    # node-exporter exposes host metrics (CPU, memory, disk, network)
    # on port 9100. Inside the compose network, it is reachable as
    # the service name "node-exporter".
    static_configs:
      - targets: ["node-exporter:9100"]
