apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: php-apache
  namespace: hpa-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: php-apache
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Scale when average CPU usage exceeds 50% of the 200m request.
          averageUtilization: 50
  behavior:
    scaleDown:
      # Wait 5 minutes after the last scale-up before scaling down,
      # so a brief dip in traffic does not flap the replica count.
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      # The most generous policy wins: at most double, or +4 pods,
      # every 15 seconds.
      selectPolicy: Max
  # --- Custom metric example (needs Prometheus Adapter, not installed here) ---
  # To scale on requests per second instead of CPU, install the Prometheus
  # Adapter, expose `http_requests_per_second` via external.metrics.k8s.io,
  # and add a second metric entry:
  #
  #   - type: External
  #     external:
  #       metric:
  #         name: http_requests_per_second
  #         selector:
  #           matchLabels:
  #             app: php-apache
  #       target:
  #         type: AverageValue
  #         averageValue: "100"
  #
  # The HPA then takes the largest replica count any metric asks for.
