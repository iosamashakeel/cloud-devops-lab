apiVersion: batch/v1
kind: CronJob
metadata:
  name: hourly-cleanup
  namespace: jobs-lab
spec:
  # Top of every hour.
  schedule: "0 * * * *"
  # Never run two cleanups at the same time: if the previous run is still
  # going, skip this one instead of overlapping.
  concurrencyPolicy: Forbid
  # If the cluster was down at the scheduled time, start the missed run
  # within 5 minutes of coming back; after that, skip it.
  startingDeadlineSeconds: 300
  # Keep only the last successful run and the last 3 failed runs around,
  # so the Job history stays readable.
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app: hourly-cleanup
        spec:
          restartPolicy: Never
          containers:
            - name: cleanup
              # busybox is enough: the cleanup just logs what it would do.
              image: busybox:1.36
              command:
                - /bin/sh
                - -c
                - |
                  echo "Cleanup run at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  echo "Would delete temp files older than 24h and"
                  echo "vacuum the scratch tables here."
                  echo "Cleanup finished."
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
